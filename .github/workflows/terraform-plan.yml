name: Terraform PR Plan & Linting

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'realdha-ui/**'
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TERRAFORM_VERSION: '1.9.5'
  NODE_VERSION: '22'
  DEFAULT_REGION: 'us-central1'

jobs:
  # ============================================================================
  # 1. Frontend & Backend Application Checks
  # ============================================================================
  app-checks:
    name: Lint & Build Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: realdha-ui/package-lock.json

      - name: Verify Frontend (realdha-ui)
        working-directory: realdha-ui
        run: |
          npm ci
          npm run build

      - name: Verify Backend (backend)
        working-directory: backend
        run: |
          npm install
          npm test

  # ============================================================================
  # 2. Terraform Format & Validation
  # ============================================================================
  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: |
          terraform fmt -check -diff

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================================================
  # 3. Terraform Speculative Plan (When GCP credentials exist)
  # ============================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [app-checks, terraform-checks]
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GCP Credentials
        id: check-creds
        run: |
          if [ -n "$WIF_PROVIDER" ] || [ -n "$SA_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "No GCP credentials detected; skipping speculative plan step."
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.check-creds.outputs.has_creds == 'true' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
          token_format: 'access_token'

      - name: Authenticate to Google Cloud (Service Account Key Fallback)
        if: steps.check-creds.outputs.has_creds == 'true' && env.WIF_PROVIDER == '' && env.SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.SA_KEY }}
          token_format: 'access_token'

      - name: Set up Google Cloud SDK
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure Terraform Remote Backend (if specified)
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: terraform
        run: |
          STATE_BUCKET="${{ secrets.GCS_TF_STATE_BUCKET || vars.GCS_TF_STATE_BUCKET }}"
          if [ -n "$STATE_BUCKET" ]; then
            cat <<EOF > backend.tf
          terraform {
            backend "gcs" {
              bucket = "$STATE_BUCKET"
              prefix = "terraform/state/staging"
            }
          }
          EOF
          fi

      - name: Terraform Init
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: terraform
        run: |
          terraform init -input=false

      - name: Terraform Plan
        if: steps.check-creds.outputs.has_creds == 'true'
        id: plan
        working-directory: terraform
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID || 'mock-plan-project' }}"
          REGION="${{ secrets.GCP_REGION || vars.GCP_REGION || env.DEFAULT_REGION }}"

          terraform plan -input=false -no-color \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="environment=pr-${{ github.event.pull_request.number }}" \
            -out=tfplan > plan_output.txt

          cat plan_output.txt

      - name: Add Plan to Step Summary
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: terraform
        run: |
          echo "### 📋 Terraform Plan Output (PR #${{ github.event.pull_request.number }})" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          tail -n 100 plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
